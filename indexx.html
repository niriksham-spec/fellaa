<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00797d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fella Ride · Shared Rides</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{--bg:#fff;--panel2:#f3fbfb;--line:#d3ebeb;--text:#0a3d42;--muted:#4f7f84;--a:#00797d;--b:#0aa5ab;--dark:#00595c;--ok:#0d8f74;--warn:#b77900;--bad:#d13b64;--pink:#e5488a;--pinkbg:#fde8f2;--gold:#f5a623}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(900px 500px at 0% -10%,#00797d14,transparent 60%),radial-gradient(800px 500px at 110% 0%,#0aa5ab10,transparent 60%),var(--bg)}
  #app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  #app.splash-mode{display:block}
  aside{position:sticky;top:0;height:100vh;padding:24px 16px;overflow:auto;display:flex;flex-direction:column;color:#fff;background:linear-gradient(180deg,#00595c,#00797d)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:#fff;box-shadow:0 10px 30px #00000033}
  .sub{color:#b9e6e7;font-size:12px;margin:6px 0 26px}
  nav{display:flex;flex-direction:column;gap:6px}
  .nav-btn{all:unset;cursor:pointer;padding:11px 14px;border-radius:12px;font-size:14px;color:#c9efef;display:flex;align-items:center;gap:10px;transition:.2s}
  .nav-btn:hover{background:#ffffff1f;color:#fff}
  .nav-btn.on{background:#ffffff2e;color:#fff;box-shadow:inset 3px 0 0 #fff}
  .me-card{margin-top:auto;background:#ffffff14;border:1px solid #ffffff33;border-radius:14px;padding:14px;font-size:13px}
  main{padding:28px 34px;overflow:auto}
  h1{font-size:28px;margin:0 0 6px;letter-spacing:-.3px;color:var(--dark)}
  h3{margin:0 0 12px;font-size:17px;color:var(--dark)}
  .lead{color:var(--muted);margin:0 0 24px}
  .muted{color:var(--muted);font-size:13px}
  .cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .card{background:linear-gradient(180deg,#fff,var(--panel2));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 30px #00797d14;transition:transform .2s,border-color .2s}
  .card:hover{border-color:#8fd3d5;transform:translateY(-2px)}
  .card.pinkride{border-color:#f2a7c6;background:linear-gradient(180deg,#fff,var(--pinkbg))}
  .stat .n{font-size:28px;font-weight:800;color:var(--dark)}
  .stat .l{color:var(--muted);font-size:13px;margin-top:4px}
  .hero{background:linear-gradient(120deg,#00797d,#0aa5ab);border-color:#00797d;color:#fff}
  .hero:hover{transform:none}
  .hero h2{margin:8px 0 6px;font-size:26px}
  .hero .muted,.hero p{color:#e3fafa}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#e6f5f5;color:#3d6e73;white-space:nowrap}
  .pill.ok{background:#d7f5ec;color:var(--ok)}
  .pill.warn{background:#fdf1d6;color:var(--warn)}
  .pill.bad{background:#fde0e7;color:var(--bad)}
  .pill.hot{background:#d4f1f1;color:var(--dark)}
  .pill.pink{background:var(--pinkbg);color:#b8336e}
  .btn{all:unset;display:inline-block;cursor:pointer;text-align:center;padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 20px #00797d44;transition:.2s}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
  .btn.ghost{background:#fff;border:1px solid var(--line);box-shadow:none;color:var(--dark)}
  .hero .btn{background:#fff;color:var(--dark);box-shadow:none}
  .bar{height:8px;background:#e1f3f3;border-radius:99px;overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .6s}
  .frow{display:flex;justify-content:space-between;font-size:14px;margin-top:16px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:13px}
  .chip.on{background:var(--a);color:#fff;border-color:var(--a)}
  .form{display:grid;gap:12px}
  label{display:grid;gap:6px;font-size:12px;color:var(--muted)}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font:inherit;font-size:14px}
  input:focus,select:focus,textarea:focus{outline:2px solid #00797d55;border-color:var(--a)}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}
  .check input{width:auto}
  .code{background:#f3fbfb;border:1px dashed #8fd3d5;padding:10px 12px;border-radius:12px;margin-top:12px;font-size:14px;word-break:break-all}
  .checkin{display:flex;gap:8px;margin-top:12px}
  .checkin input{max-width:170px}
  .irow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
  .note{color:var(--muted);border-style:dashed}
  .toast{position:fixed;right:24px;bottom:24px;max-width:360px;padding:14px 18px;border-radius:14px;background:var(--dark);color:#fff;box-shadow:0 20px 50px #00595c55;animation:pop .3s ease;z-index:60}
  @keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .errbox{margin:24px;padding:20px;border-radius:14px;background:#fde0e7;color:#8a1538;font-family:monospace;white-space:pre-wrap;word-break:break-word}
  .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#e3fafa,#fff 60%)}
  .auth-card{width:100%;max-width:420px}
  .day-chip{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;background:#f3fbfb;border:1px solid var(--line);margin-bottom:8px}
  .flip{perspective:900px;height:170px;cursor:pointer}
  .flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
  .flip.on .flip-in{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:6px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 30px #00797d14}
  .face.back{transform:rotateY(180deg);background:linear-gradient(120deg,#00797d,#0aa5ab);color:#fff;border-color:#00797d}
  .face.back .muted{color:#e3fafa}
  .big2{font-size:30px;font-weight:800;color:var(--dark)}
  .stars{color:var(--gold);letter-spacing:2px}
  .rate-row{display:grid;grid-template-columns:1.4fr 1.2fr 1fr auto;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
  .rate-row:last-child{border-bottom:none}
  .role-btns{display:flex;gap:8px;flex-wrap:wrap}
  #map{height:480px;border-radius:14px;z-index:1}
  .car{width:30px;height:30px;line-height:28px;text-align:center;font-size:16px;background:#fff;border:2px solid var(--a);border-radius:50%;box-shadow:0 2px 6px #00000033}
  .car.pink{border-color:var(--pink)}
  .you-dot{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 4px #2563eb44}
  .avail-item{padding:12px 0;border-bottom:1px solid var(--line)}
  .avail-item:last-child{border-bottom:none}
  .gift-overlay{position:fixed;inset:0;background:#00595ccc;display:grid;place-items:center;z-index:50;padding:20px}
  .gift-modal{background:#fff;border-radius:22px;padding:30px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 30px 80px #00000055;animation:giftPop .7s cubic-bezier(.2,1.6,.4,1) both}
  .gift-modal h2{margin:14px 0 8px;color:var(--dark);font-size:22px}
  .gift-modal p{color:var(--muted);margin:0 0 18px}
  @keyframes giftPop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
  .gift{position:relative;width:130px;height:120px;margin:0 auto;animation:wobble 2.4s ease-in-out .8s infinite}
  @keyframes wobble{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg)}30%{transform:rotate(6deg)}45%{transform:rotate(-4deg)}60%{transform:rotate(0)}}
  .gift .body{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(160deg,#0aa5ab,#00797d);border-radius:8px}
  .gift .lid{position:absolute;top:26px;left:-6px;right:-6px;height:26px;background:linear-gradient(160deg,#16b5bb,#00797d);border-radius:6px}
  .gift .ribbon{position:absolute;left:50%;top:26px;bottom:0;width:14px;margin-left:-7px;background:var(--pink)}
  .gift .bow{position:absolute;top:0;left:50%;width:44px;height:30px;margin-left:-22px;border:7px solid var(--pink);border-bottom:none;border-radius:50% 50% 0 0}
  .splash{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center;color:#fff;background:linear-gradient(160deg,#00595c,#00797d 55%,#0aa5ab)}
  .splash-inner{width:100%;max-width:560px;animation:rise .9s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .hero-svg{width:100%;max-width:520px;height:auto;filter:drop-shadow(0 0 28px #ffffff55)}
  .wl,.wr{transform-box:view-box;transform-origin:200px 150px;animation:flap 1.8s ease-in-out infinite}
  @keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42)}}
  .flow{stroke-dasharray:6 8;animation:flow 2.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.8);opacity:0}}
  .splash-title{font-size:46px;font-weight:900;letter-spacing:-1px;margin:4px 0 6px;color:#fff}
  .splash-sub{color:#d8f5f5;margin:0 0 6px;font-size:16px}
  .splash-btn{font-size:16px;padding:14px 28px;margin-top:16px;background:#fff;color:var(--dark);box-shadow:none}
  @media (max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:20px 16px}.splash-title{font-size:36px}.rate-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="errbox" id="boot">Loading Fella Ride…</div></div>
<script>
window.addEventListener('error', e => {
  const box = document.getElementById('boot') || document.getElementById('app');
  if (box) box.innerHTML = '<div class="errbox">Something went wrong:\n' + esc(e.message) + '\n(line ' + e.lineno + ')</div>';
});
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---------- Setup ----------
const API = 'https://fellafly.onrender.com';
const AREAS = ['North Gate', 'Tech Park', 'Old Town', 'Lake Side', 'Station Road'];
const DESTS = ['Campus', 'Airport', 'Railway Station', 'Bus Stand'];
const TIMES = ['07:30', '08:00', '08:30', '09:00', '17:30', '18:00'];
const AIR_TIMES = ['04:30', '06:00', '09:30', '13:00', '18:00', '21:30'];
const PLACES = ['Campus', 'North Gate', 'Tech Park', 'Old Town', 'Lake Side', 'Station Road', 'Railway Station', 'Bus Stand', 'Airport'];
const PLACE_OFF = { 'Campus': [0, 0], 'North Gate': [0.012, 0], 'Tech Park': [0.006, 0.012], 'Old Town': [-0.008, -0.010], 'Lake Side': [-0.010, 0.008], 'Station Road': [0.002, -0.014], 'Railway Station': [-0.020, -0.030], 'Bus Stand': [0.004, -0.020], 'Airport': [0.090, 0.080] };
const GENDERS = ['Female', 'Male', 'Non-binary', 'Prefer not to say'];
const ROLE = { driver: 'Driver', passenger: 'Passenger', connector: 'Contractor' };
const TAGS = ['Polite', 'On time', 'Safe driving', 'Friendly', 'Clean vehicle', 'Good conversation', 'Respectful', 'Reliable', 'Late', 'Rude'];
const GIFT_EVERY = 50, CO2 = 0.12, POINTS_PER_CREDIT = 100, POINTS_REFERRER = 100;

// ---------- State ----------
let token = localStorage.getItem('fr-token');
let activeId = localStorage.getItem('fr-active');
let me = null, communities = [], trips = [], referrals = [], streakDays = [], detail = null;
let pending = [], rep = null;
let booting = !!token;
let view = 'dashboard', showSplash = true;
let authMode = 'login', authStep = 'email', pendingLogin = null, devCode = '';
let giftDismissed = false, flipped = {}, toastMsg = '', toastTimer = null, fares = {};
let tripDraft = { from: 'Tech Park', to: 'Campus', time: '08:00', credit: false };
let airDraft = { dir: 'to', area: 'North Gate', time: '06:00', credit: false };
let mapInstance = null, rideLayer = null, userLL = null, myLoc = null;
let sharing = localStorage.getItem('fr-sharing') === '1', locTimer = null;
let es = null, connectedFor = null, syncTimer = null, liveOn = false;

// ---------- Small helpers ----------
const opts = (sel, list) => list.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
const dayKey = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const totals = () => ({
  n: trips.length,
  km: trips.reduce((s, t) => s + t.km, 0),
  co2: trips.reduce((s, t) => s + t.co2, 0),
  saved: trips.reduce((s, t) => s + (t.autoFare - t.fare), 0),
});
const ago = t => Math.max(0, Math.round((Date.now() - new Date(t).getTime()) / 60000));
const header = (t, l) => `<h1>${t}</h1><p class="lead">${l}</p>`;
const note = t => `<section class="card note">${esc(t)}</section>`;
const statCard = (n, l) => `<section class="card stat"><div class="n">${n}</div><div class="l">${l}</div></section>`;
const tierPill = t => `<span class="pill ${t === 'Activate now' ? 'hot' : t === 'Nudge' ? 'warn' : ''}">${t}</span>`;
const brandHtml = () => `<div class="brand" style="color:var(--dark);justify-content:center;margin-bottom:6px"><div class="logo" style="background:linear-gradient(135deg,#00797d,#0aa5ab);color:#fff">🦋</div>Fella Ride</div>`;
const toastHtml = () => toastMsg ? `<div class="toast">${esc(toastMsg)}</div>` : '';
const noCommunity = t => header(t, '') + note('Choose a community from the sidebar, or create one on the Communities page.');
const busy = () => ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement && document.activeElement.tagName);
function starsHtml(avg, big) {
  if (avg === null || avg === undefined) return '<span class="muted">No ratings yet</span>';
  const f = Math.round(avg);
  return `<span class="stars" style="font-size:${big ? 22 : 14}px">${'★'.repeat(f)}${'☆'.repeat(5 - f)}</span> <b>${Number(avg).toFixed(1)}</b>`;
}

// ---------- Server connection ----------
async function api(path, body, method) {
  const headers = { 'Content-Type': 'application/json', 'X-Day': dayKey() };
  if (token) headers.Authorization = 'Bearer ' + token;
  let res;
  try {
    res = await fetch(API + path, { method: method || (body ? 'POST' : 'GET'), headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw new Error('Cannot reach the server. Check your internet connection and try again.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || 'Something went wrong.'); err.status = res.status; throw err; }
  return data;
}

// Reload everything this screen needs from the server
async function refresh(quiet) {
  if (!token) { me = null; booting = false; return render(); }
  try {
    me = (await api('/api/me')).user;
    communities = (await api('/api/communities')).communities;
    trips = (await api('/api/trips')).trips;
    referrals = (await api('/api/referrals')).referrals;
    streakDays = (await api('/api/streak')).days;
    pending = (await api('/api/ratings/pending')).pending;
    rep = await api('/api/reputation/me');
    if (!communities.some(c => c.id === activeId)) activeId = ((communities.find(c => c.joined) || communities[0]) || {}).id || null;
    if (activeId) { localStorage.setItem('fr-active', activeId); detail = await api('/api/communities/' + activeId); } else detail = null;
    if (connectedFor !== activeId) connectEvents();
    if (sharing && !locTimer) resumeSharing();
  } catch (e) {
    if (e.status === 401) {
      token = null; me = null; localStorage.removeItem('fr-token');
      if (es) { es.close(); es = null; connectedFor = null; }
    } else if (!quiet) flash(e.message);
  }
  booting = false;
  render();
}

// Run a server action, reload the data, and show a message
async function act(fn, msg) {
  try {
    const r = await fn();
    await refresh(true);
    if (msg) flash(typeof msg === 'function' ? msg(r) : msg);
  } catch (e) { flash(e.message); }
}

// Fare estimates come from the server, so every screen shows the same numbers
function fareFor(from, to) {
  const k = from + '|' + to;
  if (!(k in fares)) {
    fares[k] = 'loading';
    api(`/api/fare?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`)
      .then(f => { fares[k] = f; render(); })
      .catch(() => { fares[k] = false; render(); });
  }
  return fares[k] && fares[k] !== 'loading' ? fares[k] : null;
}

// ---------- Login: email code, or guest ----------
async function requestCode(fd) {
  pendingLogin = {
    mode: authMode,
    email: String(fd.get('email') || '').trim().toLowerCase(),
    name: fd.get('name') || '',
    gender: fd.get('gender') || '',
    referral: fd.get('referral') || '',
  };
  await sendPending();
}
async function sendPending() {
  try {
    const r = await api('/api/auth/request-otp', pendingLogin);
    authStep = 'code';
    devCode = r.devCode || '';
    flash('We sent a 6-digit code to ' + pendingLogin.email + '. Check your inbox and spam folder.');
  } catch (e) { flash(e.message); }
}
async function verifyCode(fd) {
  try {
    const d = await api('/api/auth/verify', { email: pendingLogin.email, code: String(fd.get('code') || '').trim() });
    token = d.token;
    localStorage.setItem('fr-token', token);
    authStep = 'email'; devCode = ''; giftDismissed = false;
    await refresh(true);
    flash('Welcome, ' + d.user.name + '!');
  } catch (e) { flash(e.message); }
}
async function doGuest() {
  try {
    const d = await api('/api/guest', {});
    token = d.token;
    localStorage.setItem('fr-token', token);
    giftDismissed = false;
    await refresh(true);
    flash('Browsing as guest. Create an account to keep your data for next time.');
  } catch (e) { flash(e.message); }
}
async function doLogout() {
  try { if (sharing) await stopSharing(true); await api('/api/logout', {}); } catch (e) { /* ignore */ }
  token = null; me = null; detail = null; communities = []; pending = []; rep = null;
  if (es) { es.close(); es = null; }
  connectedFor = null;
  localStorage.removeItem('fr-token');
  render();
}

// ---------- Live updates (server-sent events) ----------
function setLive(on) {
  liveOn = on;
  const el = document.getElementById('live');
  if (el) { el.textContent = on ? '● Live' : '○ Reconnecting…'; el.style.color = on ? '#0d8f74' : '#b77900'; }
}
function connectEvents() {
  if (es) { es.close(); es = null; }
  connectedFor = activeId;
  if (!token || !activeId) return;
  es = new EventSource(`${API}/api/events?token=${encodeURIComponent(token)}&community=${encodeURIComponent(activeId)}`);
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);
  es.onmessage = e => {
    let kind = 'changed';
    try { kind = JSON.parse(e.data).type || 'changed'; } catch (x) { /* keep default */ }
    scheduleSync(kind);
  };
}
function scheduleSync(kind = 'changed') {
  if (kind === 'location' && view !== 'map') return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    if (busy()) return scheduleSync(kind);
    if (view === 'map') pollMap(); else refresh(true);
  }, 400);
}
async function pollMap() {
  if (!activeId || !token) return;
  try { detail = await api('/api/communities/' + activeId); updateMap(); } catch (e) { /* try again next time */ }
}

// ---------- Shared live location (15 minutes) ----------
function sendMyLocation(silent) {
  if (!navigator.geolocation) { if (!silent) flash('Location is not available on this device.'); return; }
  navigator.geolocation.getCurrentPosition(async p => {
    myLoc = [p.coords.latitude, p.coords.longitude];
    try { await api('/api/location', { lat: myLoc[0], lng: myLoc[1] }); updateMap(); }
    catch (e) { if (!silent) flash(e.message); }
  }, () => {
    if (!silent) flash('Location permission was not allowed. Allow it in your browser or phone settings.');
    stopSharing(true);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
}
function resumeSharing() {
  clearInterval(locTimer);
  sendMyLocation(true);
  locTimer = setInterval(() => sendMyLocation(true), 15000);
}
function startSharing() {
  sharing = true;
  localStorage.setItem('fr-sharing', '1');
  resumeSharing();
  flash('Your location is shared with your community for 15 minutes.');
  render();
}
async function stopSharing(silent) {
  sharing = false;
  localStorage.removeItem('fr-sharing');
  clearInterval(locTimer); locTimer = null; myLoc = null;
  try { if (token) await api('/api/location/stop', {}); } catch (e) { /* ignore */ }
  if (!silent) flash('Location sharing stopped.');
  render();
}

// ---------- Flash messages ----------
function flash(msg) {
  toastMsg = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastMsg = ''; render(); }, 2800);
  render();
}

function rideCard(r) {
  let action = '';
  if (r.mine) action = `<div class="code">Your pickup code: <b>${r.code}</b><div class="muted">Show this code to the driver to board.</div></div>`;
  else if (r.isOwn) {
    action = (r.completed ? '' : `<button class="btn ghost" style="margin-top:12px" data-act="complete" data-id="${r.id}">Mark trip completed</button>`) +
      `<form class="checkin" data-form="checkin" data-id="${r.id}"><input name="code" inputmode="numeric" maxlength="4" placeholder="Passenger code" required/><button class="btn ghost" type="submit">Check in</button></form>`;
  } else if (r.seatsLeft <= 0) action = '<p class="muted" style="margin:10px 0 0">Full</p>';
  else {
    const why = clientBlock(r);
    action = why ? `<p class="muted" style="margin:10px 0 0">${esc(why)}</p>` : `<button class="btn" style="margin-top:12px" data-act="book" data-id="${r.id}">Book seat</button>`;
  }
  const pct = Math.round(r.booked / r.seats * 100);
  const driverLine = r.driverId && !r.isOwn ? `<div class="muted" style="margin-top:8px">Driver rating: ${starsHtml(r.driverRating, false)}</div>` : '';
  return `<section class="card ${r.pink ? 'pinkride' : ''}">
    <div class="row"><div><b>${r.isOwn ? 'Your ride' : esc(r.driverName)}</b><div class="muted">${esc(r.area)} → ${esc(r.dest)} · ${r.time}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        ${r.completed ? '<span class="pill ok">Completed</span>' : ''}
        ${r.pink ? '<span class="pill pink">Pink · women only</span>' : ''}
        <span class="pill ${r.seatsLeft > 0 ? 'ok' : 'bad'}">${r.seatsLeft > 0 ? r.seatsLeft + ' seats left' : 'Full'}</span>
      </div></div>
    ${driverLine}
    <div class="bar" style="margin:16px 0 8px"><span style="width:${pct}%"></span></div>
    <div class="muted">${r.booked} booked · ${r.checked} checked in</div>
    ${action}
  </section>`;
}
function viewRides() {
  if (!detail) return noCommunity('Rides');
  let post = '';
  if (!detail.me) post = note('Join this community on the Profile page to post rides and book seats.');
  else if (detail.me.role === 'driver') {
    const typeField = me.gender === 'Female' ? `<label>Type<select name="type"><option value="standard">Standard</option><option value="pink">Pink (women only)</option></select></label>` : '';
    post = `<section class="card" style="margin-bottom:16px"><h3>Post a ride</h3>
      <form class="cols" data-form="post" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end">
        <label>From<select name="area">${opts(detail.me.area, AREAS)}</select></label>
        <label>To<select name="dest">${opts('Campus', DESTS)}</select></label>
        <label>Departure<select name="time">${opts(detail.me.time, TIMES)}</select></label>
        <label>Seats<select name="seats">${[1, 2, 3, 4].map(n => `<option ${n === 3 ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        ${typeField}
        <button class="btn" type="submit">Post ride</button>
      </form></section>`;
  } else post = note('You are a ' + ROLE[detail.me.role] + ' here. Choose Driver on the dashboard to post rides.');
  return header('Rides', 'Book seats on rides, post rides as a driver, and check passengers in with their pickup code.') + post +
    (detail.rides.length ? `<div class="cols">${detail.rides.map(rideCard).join('')}</div>` : note('No rides in this community yet.'));
}
function viewMembers() {
  if (!detail) return noCommunity('Members');
  const cards = detail.members.map(m => `<section class="card">
    <div class="row"><div><b>${esc(m.name)}</b>${m.isMe ? ' <span class="pill hot">You</span>' : ''}<div class="muted">${ROLE[m.role]} · ${esc(m.area)} · ${m.time}</div></div></div>
    <div style="margin-top:12px">${starsHtml(m.rating.avg, false)}${m.rating.count ? ` <span class="muted">(${m.rating.count})</span>` : ''}</div>
    ${m.rating.top ? `<div style="margin-top:8px"><span class="pill pink">${esc(m.rating.top)}</span></div>` : ''}
    ${m.prefWomen ? '<div style="margin-top:10px"><span class="pill pink">Prefers women drivers</span></div>' : ''}
  </section>`).join('');
  return header('Members', `Everyone who has joined ${esc(detail.community.name)}, with their ratings.`) +
    (cards ? `<div class="cols">${cards}</div>` : note('No members yet. Share the community code so people can join.'));
}
function viewActivation() {
  if (!detail) return noCommunity('Activation');
  if (!detail.me) return header('Activation', 'Finds members close to riding and tracks which nudges turn into rides.') + note('Join this community on the Profile page to use the activation engine.');
  const list = detail.interventions;
  const sent = list.filter(i => i.status !== 'draft').length;
  const conv = list.filter(i => i.status === 'converted').length;
  const rate = sent ? Math.round(conv / sent * 100) : 0;
  const rows = list.map(i => `<section class="card irow">
    <div><b>${esc(i.name)}</b> <span class="pill">${esc(i.type.replace('_', ' '))}</span><div class="muted" style="margin-top:6px">${esc(i.message)}</div></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="pill ${i.status === 'converted' ? 'ok' : i.status === 'sent' ? 'warn' : ''}">${i.status}</span>
      ${i.status === 'draft' ? `<button class="btn ghost" data-act="markSent" data-id="${i.id}">Mark sent</button>` : ''}</div>
  </section>`).join('');
  return header('Activation', 'Finds members close to riding, writes the next step for each, and tracks which nudges turn into rides.') +
    `<div class="row" style="margin-bottom:18px"><button class="btn" data-act="runActivation">Run activation engine</button></div>
    <div class="cols stats" style="margin-bottom:18px">${statCard(list.length, 'Interventions')}${statCard(sent, 'Sent')}${statCard(conv, 'Became riders')}${statCard(rate + '%', 'Conversion')}</div>` +
    (rows || note('No interventions yet. Press Run activation engine.'));
}
function viewReferrals() {
  const list = referrals.map(r => `<div class="row" style="margin-bottom:10px"><span>${esc(r.name)}</span><span class="pill ok">+${POINTS_REFERRER} points</span></div>`).join('');
  return header('Referrals & tokens', `Share your code. Each neighbour who signs up with it earns you ${POINTS_REFERRER} points, and they get 20. Redeem ${POINTS_PER_CREDIT} points for a free ride.`) + `
    <div class="cols">
      <section class="card hero">
        <div class="muted">Your referral code</div>
        <div class="big2" style="color:#fff;letter-spacing:3px">${esc(me.refCode)}</div>
        <p style="margin:0 0 16px">You have ${referrals.length} referral(s) and ${me.points} token points.</p>
        <button class="btn" data-act="copyRef">Copy code</button>
      </section>
      <section class="card"><h3>Your referrals</h3>
        ${list || '<p class="muted">No referrals yet. Share your code, and ask a friend to type it on the sign-up page.</p>'}
        <div style="margin-top:14px"><button class="btn ghost" data-act="redeem">Redeem ${POINTS_PER_CREDIT} points for a free ride</button></div>
      </section>
    </div>`;
}
function viewMap() {
  if (!detail) return noCommunity('Live map');
  return header('Live map', `See rides moving toward the ${detail.community.type === 'Workplace' ? 'office' : 'campus'}, seats open, and members who share their location.`) + `
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
      <button class="btn ${sharing ? 'ghost' : ''}" data-act="shareLoc">${sharing ? 'Stop sharing my location' : 'Share my live location'}</button>
      <span id="live" class="muted" style="color:${liveOn ? '#0d8f74' : '#b77900'}">${liveOn ? '● Live' : '○ Connecting…'}</span>
      <span class="muted">Shared locations show for 15 minutes. Ride positions are simulated from departure time.</span>
    </div>
    <div class="cols">
      <section class="card" style="padding:10px"><div id="map"></div></section>
      <section class="card"><h3>Live availability</h3><div id="avail"></div></section>
    </div>`;
}
function viewJoin() {
  const prof = `<section class="card" style="max-width:640px;margin-bottom:16px"><h3>Your profile</h3>
    <form class="form" data-form="profile">
      <label>Name<input value="${esc(me.name)}" disabled/></label>
      <label>Gender (decides which rides you can see)<select name="gender">${opts(me.gender, GENDERS)}</select></label>
      <label class="check"><input type="checkbox" name="prefWomen" ${me.prefWomen ? 'checked' : ''}/> Women accounts only: I prefer women drivers</label>
      <button class="btn" type="submit">Save profile</button>
    </form></section>`;
  let join = note('Choose a community from the sidebar first.');
  if (detail) {
    join = (detail.me ? note(`You are in ${detail.community.name} as ${ROLE[detail.me.role]}. Change your role on the dashboard.`) : '') +
      (detail.me ? '' : `<section class="card" style="max-width:640px"><h3>Join ${esc(detail.community.name)}</h3>
      <p class="muted">Optional. Joining lets you post rides and appear in the member list.</p>
      <form class="form" data-form="join">
        <label>Community code<input name="code" required placeholder="Ask your community admin"/></label>
        <label>Role<select name="role">${Object.entries(ROLE).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
        <label>Home area<select name="area">${opts('North Gate', AREAS)}</select></label>
        <label>Usual departure<select name="time">${opts('08:00', TIMES)}</select></label>
        <button class="btn" type="submit">Join community</button>
      </form></section>`);
  }
  return header('Profile', 'Set your gender and preferences. Your rating and the words people chose for you show below.') + prof +
    `<div style="max-width:640px;margin-bottom:16px">${myRepCard()}</div>` + join;
}

const views = {
  dashboard: viewDashboard, impact: viewImpact, book: viewBook, airport: viewAirport, communities: viewCommunities,
  rides: viewRides, members: viewMembers, activation: viewActivation, map: viewMap, referrals: viewReferrals, join: viewJoin,
};

// ---------- Live map ----------
const placeLL = name => { const c = detail ? detail.community.campus : [12.9716, 77.5946]; const o = PLACE_OFF[name] || [0, 0]; return [c[0] + o[0], c[1] + o[1]]; };
const strHash = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h / 4294967296; };
const rideProgress = r => ((Date.now() / 60000) / 20 + strHash(r.id)) % 1;
function ridePos(r) { const a = placeLL(r.area), b = placeLL(r.dest), t = rideProgress(r); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
function etaMin(r) { return Math.max(1, Math.ceil((1 - rideProgress(r)) * 20)); }
function cleanupMap() { if (mapInstance) { mapInstance.remove(); mapInstance = null; rideLayer = null; } }
function mountMap() {
  const el = document.getElementById('map');
  if (!el) return;
  if (typeof L === 'undefined') { el.innerHTML = '<p class="muted" style="padding:20px">The map could not load. Check your internet connection and refresh.</p>'; return; }
  cleanupMap();
  mapInstance = L.map('map').setView(userLL || detail.community.campus, userLL ? 15 : 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(mapInstance);
  rideLayer = L.layerGroup().addTo(mapInstance);
  updateMap();
  setTimeout(() => { if (mapInstance) mapInstance.invalidateSize(); }, 80);
}
function updateMap() {
  if (!mapInstance || !rideLayer || !detail) return;
  rideLayer.clearLayers();
  const c = detail.community.campus;
  L.circleMarker(c, { radius: 10, color: '#00595c', fillColor: '#ffffff', fillOpacity: 1, weight: 3 })
    .bindPopup(`<b>${detail.community.type === 'Workplace' ? 'Office' : 'Campus'}</b>`).addTo(rideLayer);
  ['Airport', 'Railway Station', 'Bus Stand'].forEach(p => {
    L.circleMarker(placeLL(p), { radius: 7, color: '#00595c', fillColor: '#ffffff', fillOpacity: 1, weight: 2 }).bindPopup(`<b>${esc(p)}</b>`).addTo(rideLayer);
  });
  AREAS.forEach(a => {
    const open = detail.rides.filter(r => r.area === a && r.seatsLeft > 0);
    const seats = open.reduce((s, r) => s + r.seatsLeft, 0);
    L.circleMarker(placeLL(a), { radius: 9, color: '#00595c', fillColor: '#0aa5ab', fillOpacity: .85, weight: 2 })
      .bindPopup(`<b>${esc(a)}</b><br>${open.length} ride(s) · ${seats} seat(s) open`).addTo(rideLayer);
  });
  detail.rides.forEach(r => {
    const color = r.pink ? '#e5488a' : r.mine ? '#00595c' : '#7fc9cb';
    L.polyline([placeLL(r.area), placeLL(r.dest)], { color, weight: r.mine ? 4 : 2, dashArray: '6 6', opacity: .8 }).addTo(rideLayer);
    const icon = L.divIcon({ className: '', html: `<div class="car ${r.pink ? 'pink' : ''}">🚗</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
    L.marker(ridePos(r), { icon }).bindPopup(
      `<b>${esc(r.driverName)}</b><br>${esc(r.area)} → ${esc(r.dest)} · ${r.time}<br>ETA: ${etaMin(r)} min<br>${r.seatsLeft > 0 ? r.seatsLeft + ' seat(s) left' : 'Full'}`
    ).addTo(rideLayer);
  });
  (detail.locations || []).forEach(l => {
    if (l.isMe) return;
    L.circleMarker([l.lat, l.lng], { radius: 8, color: '#00595c', fillColor: '#2563eb', fillOpacity: 1, weight: 2 })
      .bindPopup(`<b>${esc(l.name)}</b><br>Shared ${ago(l.updated_at)} min ago`).addTo(rideLayer);
  });
  if (myLoc) L.marker(myLoc, { icon: L.divIcon({ className: '', html: '<div class="you-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).bindPopup('You are here').addTo(rideLayer);
  const el = document.getElementById('avail');
  if (!el) return;
  const mine = detail.rides.find(r => r.mine);
  let html = mine ? `<div class="code" style="margin:0 0 14px"><b>Your ride</b><br>Arrives in about <b>${etaMin(mine)} min</b><br>From ${esc(mine.area)} · pickup code <b>${mine.code}</b></div>` : '';
  html += AREAS.map(a => {
    const open = detail.rides.filter(r => r.area === a && r.seatsLeft > 0);
    const seats = open.reduce((s, r) => s + r.seatsLeft, 0);
    return `<div class="avail-item row"><div><b>${esc(a)}</b><div class="muted">${open.length} open ride(s)</div></div>
      <span class="pill ${seats > 0 ? 'ok' : 'bad'}">${seats > 0 ? seats + ' seats' : 'Full'}</span></div>`;
  }).join('');
  const sharers = (detail.locations || []).filter(l => !l.isMe).length;
  html += `<p class="muted" style="margin-top:14px">${sharers} member(s) sharing their location right now.</p>`;
  el.innerHTML = html;
}

// ---------- Rendering ----------
function render() {
  const app = document.getElementById('app');
  try {
    if (showSplash) { app.classList.add('splash-mode'); cleanupMap(); app.innerHTML = splash(); return; }
    if (booting) { app.classList.add('splash-mode'); cleanupMap(); app.innerHTML = '<div class="auth-wrap"><p class="muted">Loading Fella Ride…</p></div>'; return; }
    if (!me) { app.classList.add('splash-mode'); cleanupMap(); app.innerHTML = authView() + toastHtml(); return; }
    app.classList.remove('splash-mode');
    const showGift = view === 'dashboard' && !giftDismissed && Math.floor(me.logs / GIFT_EVERY) > me.giftClaims;
    app.innerHTML = sidebar() + `<main>${views[view]()}</main>` + (showGift ? giftOverlay() : '') + toastHtml();
    if (view === 'map' && detail) mountMap(); else cleanupMap();
  } catch (err) {
    console.error(err);
    app.classList.add('splash-mode');
    app.innerHTML = '<div class="errbox">Something went wrong while drawing this page:\n' + esc(err.stack || err) + '</div>';
  }
}

// ---------- Events ----------
document.addEventListener('change', e => {
  const sel = e.target.closest('[data-switch]');
  if (sel) { activeId = sel.value; localStorage.setItem('fr-active', activeId); return refresh(true); }
  const f = e.target.closest('form[data-form]');
  if (f && (f.dataset.form === 'trip' || f.dataset.form === 'air')) {
    const d = f.dataset.form === 'trip' ? tripDraft : airDraft;
    d[e.target.name] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    render();
  }
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'enter') { showSplash = false; return render(); }
  if (a === 'authMode') { authMode = el.dataset.mode; authStep = 'email'; devCode = ''; return render(); }
  if (a === 'resend') { if (pendingLogin) sendPending(); return; }
  if (a === 'changeEmail') { authStep = 'email'; devCode = ''; return render(); }
  if (a === 'guest') return doGuest();
  if (a === 'logout') return doLogout();
  if (a === 'nav') { view = el.dataset.view; giftDismissed = false; render(); return refresh(true); }
  if (a === 'switchCom') { activeId = id; localStorage.setItem('fr-active', id); view = 'dashboard'; return refresh(true); }
  if (a === 'flip') { flipped[id] = !flipped[id]; return render(); }
  if (a === 'closeGift') { giftDismissed = true; return render(); }
  if (a === 'setRole') return act(() => api(`/api/communities/${activeId}/role`, { role: el.dataset.role }, 'PUT'), 'Role updated.');
  if (a === 'complete') return act(() => api(`/api/rides/${id}/complete`, {}), 'Trip marked completed. Passengers can now rate you.');
  if (a === 'claimGift') return act(() => api('/api/gift/claim', {}), 'Free ride unlocked! Tick "Use a free ride credit" when you book.');
  if (a === 'logRide') return act(() => api('/api/activity', {}), r => r.milestone ? 'Logged. 🎁 Milestone reached! Open your gift.' : 'Logged. Streak ' + r.user.streak.count + ' · Day ' + r.user.streak.days);
  if (a === 'redeem') return act(() => api('/api/points/redeem', {}), 'Redeemed ' + POINTS_PER_CREDIT + ' points for a free ride credit.');
  if (a === 'copyRef') return navigator.clipboard.writeText(me.refCode).then(() => flash('Copied ' + me.refCode)).catch(() => flash('Your code is ' + me.refCode));
  if (a === 'book') return act(() => api(`/api/rides/${id}/book`, {}), r => 'Seat booked. Pickup code ' + r.code + ' · Fare ₹' + r.fare + (r.milestone ? ' · 🎁 Milestone!' : ''));
  if (a === 'cancelTrip') return act(() => api(`/api/trips/${id}/cancel`, {}), 'Booking cancelled.');
  if (a === 'runActivation') return act(() => api(`/api/communities/${activeId}/interventions/run`, {}), r => r.created ? r.created + ' new intervention(s) created.' : 'Everyone who needs a nudge already has one.');
  if (a === 'markSent') return act(() => api(`/api/interventions/${id}`, { status: 'sent' }, 'PUT'), 'Marked as sent.');
  if (a === 'shareLoc') return sharing ? stopSharing() : startSharing();
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f), k = f.dataset.form;
  if (k === 'otp-request') return requestCode(fd);
  if (k === 'otp-verify') return verifyCode(fd);
  if (k === 'profile') return act(() => api('/api/profile', { gender: fd.get('gender'), prefWomen: fd.get('prefWomen') === 'on' }, 'PUT'), 'Profile saved.');
  if (k === 'join') return act(() => api(`/api/communities/${activeId}/join`, { code: fd.get('code'), role: fd.get('role'), area: fd.get('area'), time: fd.get('time') }), 'Joined. Welcome!');
  if (k === 'post') return act(() => api(`/api/communities/${activeId}/rides`, { area: fd.get('area'), dest: fd.get('dest'), time: fd.get('time'), seats: Number(fd.get('seats')), pink: fd.get('type') === 'pink' }), 'Ride posted.');
  if (k === 'checkin') return act(() => api(`/api/rides/${f.dataset.id}/checkin`, { code: fd.get('code') }), 'Passenger checked in.');
  if (k === 'rate') return act(() => api('/api/ratings', { rideId: f.dataset.ride, toUserId: f.dataset.to, stars: Number(fd.get('stars')), tag: fd.get('tag') }), 'Thanks! Your feedback is saved.');
  if (k === 'newcom') return act(async () => {
    const r = await api('/api/communities', { name: fd.get('name'), type: fd.get('type') });
    activeId = r.id; localStorage.setItem('fr-active', r.id);
    return r;
  }, r => 'Community created. Share the code ' + r.code + ' so people can join.');
  if (k === 'trip') return act(() => api('/api/trips', { from: fd.get('from'), to: fd.get('to'), time: fd.get('time'), useCredit: fd.get('credit') === 'on' }),
    r => 'Booked! Pickup code ' + r.code + ' · Fare ₹' + r.fare + (r.matched ? '' : ' · shared cab assigned') + (r.milestone ? ' · 🎁 Milestone!' : ''));
  if (k === 'air') {
    const dir = fd.get('dir'), area = fd.get('area');
    return act(() => api('/api/trips', { from: dir === 'to' ? area : 'Airport', to: dir === 'to' ? 'Airport' : area, time: fd.get('time'), useCredit: fd.get('credit') === 'on' }),
      r => 'Airport ride booked! Pickup code ' + r.code + ' · Fare ₹' + r.fare + (r.milestone ? ' · 🎁 Milestone!' : ''));
  }
});

// Fallback refresh every 15 seconds, in case the live connection drops
setInterval(() => {
  if (!token || !me || showSplash || busy()) return;
  if (view === 'map') pollMap(); else refresh(true);
}, 15000);

// ---------- Start ----------
render();
if (token) refresh(true);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
